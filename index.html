<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>Doctor Zeinab</title>
<style>
:root{--bg:#f6f3fb;--card:#fff;--text:#292335;--muted:#817a8e;--p:#704aa7;--p2:#a78bd0;--soft:#eee7f8;--line:#e9e3f0;--ok:#35a56f;--danger:#c84d62;--shadow:0 10px 28px rgba(70,42,100,.09)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:92px}
header{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,#8d6ac0,#5b3b8e);display:grid;place-items:center;color:#fff;font-weight:900;font-size:19px;box-shadow:0 8px 18px #6d4aa52e}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--shadow);color:var(--p)}
main{padding:8px 16px}.hero{background:linear-gradient(135deg,#6e49a4,#9473c0);color:white;border-radius:27px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#ffffff18;left:-45px;top:-55px}.hero h2{margin:0 0 5px;font-size:25px}.hero p{margin:0;opacity:.86}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.stat b{display:block;font-size:23px;color:var(--p)}.stat span,.muted{font-size:12px;color:var(--muted)}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h3{margin:0;font-size:18px}.link{color:var(--p);font-weight:700;background:none}.task{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{width:29px;height:29px;border:2px solid #cfc5dc;border-radius:10px;background:white;color:white;display:grid;place-items:center;flex:none}.check.done{background:var(--ok);border-color:var(--ok)}.taskbody{flex:1;min-width:0}.taskbody b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.taskbody small{color:var(--muted)}.actions{display:flex;gap:6px}.mini{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--p)}.danger{color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:18px 4px}.progress{height:9px;background:#eee9f3;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6f4ba5,#ad92d3);border-radius:inherit}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{background:none;color:#8a8295;padding:5px;font-size:11px}.nav button.active{color:var(--p);font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:2px}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:83px;width:54px;height:54px;border-radius:18px;background:var(--p);color:#fff;font-size:28px;box-shadow:0 10px 24px #704aa54d;z-index:15}
.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{width:100%;padding:14px;border-radius:15px;background:var(--p);color:#fff;font-weight:800;margin-top:7px}.secondary{padding:11px 14px;border-radius:13px;background:var(--soft);color:var(--p);font-weight:750}.modal{position:fixed;inset:0;background:#241b2f66;z-index:50;display:none;align-items:end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h3{margin:0 0 12px}.toast{position:fixed;z-index:80;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);background:#2f2639;color:#fff;padding:12px 17px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.pill{display:inline-flex;padding:6px 10px;border-radius:99px;background:var(--soft);color:var(--p);font-size:11px;font-weight:750}.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.prayer{padding:11px 3px;border-radius:14px;background:#faf8fc;border:1px solid var(--line);text-align:center;font-size:12px}.prayer input{accent-color:var(--p);transform:scale(1.2);margin-bottom:5px}.barrow{display:flex;align-items:center;gap:9px;margin:10px 0}.barrow span{width:66px;font-size:12px}.bar{height:8px;background:#eee9f3;border-radius:9px;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}.sleepbox{background:linear-gradient(135deg,#332649,#6b4b8e);color:#fff;border-radius:20px;padding:16px}.sleepbox button{background:#ffffff1c;color:#fff;padding:10px 13px;border-radius:12px;margin-top:10px}.calendar{font-size:12px;color:var(--muted)}
[dir=ltr]{text-align:left}.rtltext{text-align:right}
@media(max-width:370px){.prayers{grid-template-columns:repeat(3,1fr)}.hero h2{font-size:22px}}

<style>
.hero{padding:20px 19px;border-radius:28px;background:linear-gradient(135deg,#6b47a0,#9876c1)}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.daily-ring{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--pct),#ffffff32 0);position:relative;flex:none}.daily-ring:after{content:"";position:absolute;inset:7px;background:#7551a9;border-radius:50%}.daily-ring strong{position:relative;z-index:1;font-size:16px}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.quick{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:var(--shadow)}.quick .qicon{font-size:22px}.quick b{display:block;margin-top:5px}.quick small{color:var(--muted)}
.lesson-check{display:flex;align-items:center;gap:9px;padding:10px 0}.lesson-check input{accent-color:var(--p);transform:scale(1.15)}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.day-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow)}
</style>
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">DR<br>Z</div><div><h1>Doctor Zeinab</h1><small id="dateText"></small></div></div><button class="iconbtn" onclick="openSettings()">⚙️</button></header>
<main id="app"></main>

</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase,ref,set,onValue} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyAhNhpgbOVLd9UaRDIqhJMal-S8fVW8I_0",authDomain:"zvno-e163f.firebaseapp.com",databaseURL:"https://zvno-e163f-default-rtdb.firebaseio.com",projectId:"zvno-e163f",storageBucket:"zvno-e163f.firebasestorage.app",messagingSenderId:"999906835911",appId:"1:999906835911:web:a30e9274245d35e0ae6de2",measurementId:"G-R8H29924P4"};
const fb=initializeApp(firebaseConfig),db=getDatabase(fb);
const KEY="doctor_zeinab_shared_2007";
const blank={tasks:[],lessons:[],notes:[],exams:[],prayers:{},studyLog:{},target:6,sleep:{},private:{periodStart:"",periodLength:5,cycleLength:28,notes:""},settings:{lang:"ar"}};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(blank), lang=state.settings.lang||"ar", page="home", unsub=null;
function saveLocal(){state.settings.lang=lang;localStorage.setItem(KEY,JSON.stringify(state))}
function sync(){saveLocal();set(ref(db,"shared/zeinab_shared_2007/app"),state).catch(()=>{})}
try{unsub=onValue(ref(db,"shared/zeinab_shared_2007/app"),snap=>{if(snap.exists()){state={...structuredClone(blank),...snap.val()};state.settings={...blank.settings,...(snap.val().settings||{})};lang=state.settings.lang||lang;saveLocal();render()}})}catch(e){}
const T={
ar:{home:"الرئيسية",tasks:"المهام",lessons:"الدروس",stats:"الأداء",more:"المزيد",today:"اليوم",welcome:"أهلًا يا زينب 👩‍⚕️",target:"هدف المذاكرة",done:"منجز",remaining:"متبقي",addTask:"إضافة مهمة",noTasks:"مفيش مهام لسه — ضيفي أول مهمة 👇",optional:"اختياري",time:"الوقت",date:"التاريخ",taskName:"اسم المهمة",minutes:"المدة بالدقائق",save:"حفظ",cancel:"إلغاء",edit:"تعديل",delete:"حذف",addLesson:"إضافة درس",lessonName:"اسم الدرس",reminder:"التذكير",notes:"الملاحظات",addNote:"إضافة ملاحظة",noteTitle:"عنوان الملاحظة",noteText:"اكتبي ملاحظتك هنا...",prayers:"الصلاة",fajr:"الفجر",dhuhr:"الظهر",asr:"العصر",maghrib:"المغرب",isha:"العشاء",exam:"الامتحانات",addExam:"إضافة امتحان",subject:"المادة",score:"درجتك",outof:"من كام",percent:"النسبة",study:"المذاكرة",analysis:"تحليل الأداء",last7:"آخر 7 أيام",private:"Private Space",password:"كلمة المرور",wrong:"كلمة المرور غير صحيحة",unlock:"فتح",sleep:"النوم",sleepStart:"بدأت النوم",woke:"صحيت",sleepNow:"تسجيل وقت النوم",wakeNow:"تسجيل الاستيقاظ",hours:"ساعة",sleepGood:"مناسب",sleepLow:"قليل",sleepHigh:"أكثر من اللازم",language:"اللغة",arabic:"العربية",english:"English",settings:"الإعدادات",report:"تقرير PDF",targetHours:"ساعات الهدف يوميًا",period:"الصحة الشخصية",periodStart:"بداية الدورة",cycle:"طول الدورة",periodDays:"مدة الدورة",nextPeriod:"الموعد المتوقع التالي",tip:"نصيحة",sync:"المزامنة",saved:"تم الحفظ ✓",taskAdded:"تمت إضافة المهمة ✓",lessonAdded:"تمت إضافة الدرس ✓",noteAdded:"تمت إضافة الملاحظة ✓",examAdded:"تم تسجيل الامتحان ✓",noData:"لا توجد بيانات كافية بعد",motivation:["خطوة صغيرة النهارده تقربك من حلمك. 💜","مش لازم تكوني مثالية، المهم تكملي.","كل ساعة تركيز النهارده استثمار في دكتورة المستقبل.","خدي نفس، رتبي أولوياتك، وابدئي من أول خطوة.","التعب مؤقت، والهدف يستاهل الصبر.","قارني نفسك بأمس، مش بحد تاني.","حتى لو اليوم مش كامل، إنجاز واحد أحسن من ولا حاجة.","إنتِ مش مطالبة تخلصي كل حاجة مرة واحدة."]},
en:{home:"Home",tasks:"Tasks",lessons:"Lessons",stats:"Performance",more:"More",today:"Today",welcome:"Welcome, Zeinab 👩‍⚕️",target:"Study target",done:"Done",remaining:"Remaining",addTask:"Add task",noTasks:"No tasks yet — add your first one 👇",optional:"Optional",time:"Time",date:"Date",taskName:"Task name",minutes:"Duration in minutes",save:"Save",cancel:"Cancel",edit:"Edit",delete:"Delete",addLesson:"Add lesson",lessonName:"Lesson name",reminder:"Reminder",notes:"Notes",addNote:"Add note",noteTitle:"Note title",noteText:"Write your note here...",prayers:"Prayer",fajr:"Fajr",dhuhr:"Dhuhr",asr:"Asr",maghrib:"Maghrib",isha:"Isha",exam:"Exams",addExam:"Add exam",subject:"Subject",score:"Your score",outof:"Out of",percent:"Percentage",study:"Study",analysis:"Performance analysis",last7:"Last 7 days",private:"Private Space",password:"Password",wrong:"Wrong password",unlock:"Unlock",sleep:"Sleep",sleepStart:"Sleep started",woke:"Woke up",sleepNow:"Record sleep time",wakeNow:"Record wake time",hours:"hours",sleepGood:"Good",sleepLow:"Too little",sleepHigh:"More than needed",language:"Language",arabic:"Arabic",english:"English",settings:"Settings",report:"PDF Report",targetHours:"Daily target hours",period:"Personal care",periodStart:"Period start",cycle:"Cycle length",periodDays:"Period duration",nextPeriod:"Expected next date",tip:"Tip",sync:"Sync",saved:"Saved ✓",taskAdded:"Task added ✓",lessonAdded:"Lesson added ✓",noteAdded:"Note added ✓",examAdded:"Exam recorded ✓",noData:"Not enough data yet",motivation:["One small step today brings you closer to your dream. 💜","You don't need perfection; you need consistency.","Every focused hour today is an investment in your future.","Breathe, set priorities, and take the first step.","Tiredness is temporary; your goal is worth the patience.","Compare yourself with yesterday, not someone else.","Even if today isn't perfect, one achievement beats none.","You don't have to finish everything at once."]}}
const t=k=>T[lang][k]??k;
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random()}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function toast(s){const x=document.getElementById("toast");x.textContent=s;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1700)}
function modal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function renderNav(){document.getElementById("nav").innerHTML=[["home","⌂"],["tasks","✓"],["lessons","📚"],["stats","📈"],["more","☰"]].map(([p,ic])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${ic}</span>${t(p)}</button>`).join("")}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.getElementById("dateText").textContent=new Intl.DateTimeFormat(lang==="ar"?"ar-EG":"en-US",{weekday:"long",day:"numeric",month:"long"}).format(new Date());renderNav();document.getElementById("fab").style.display=["home","tasks","lessons"].includes(page)?"block":"none";document.getElementById("app").innerHTML=page==="home"?home():page==="tasks"?tasksPage():page==="lessons"?lessonsPage():page==="stats"?statsPage():morePage()}
window.go=p=>{page=p;render()}
function home(){const d=today(),tasks=state.tasks.filter(x=>x.date===d),done=tasks.filter(x=>x.done).length,mins=tasks.filter(x=>x.done).reduce((a,x)=>a+(+x.minutes||0),0),pct=tasks.length?Math.round(done/tasks.length*100):0,lessons=state.lessons.filter(x=>x.date===d),att=lessons.filter(x=>x.attended).length,pn=["fajr","dhuhr","asr","maghrib","isha"],pr=pn.filter(n=>state.prayers[d+"_"+n]).length;return `<section class="hero"><div class="hero-row"><div><h2>${t("welcome")}</h2><p>${t("today")}</p><div style="margin-top:13px"><b>${pct}%</b> ${lang==="ar"?"من مهام اليوم مكتملة":"of today's tasks completed"}</div><div class="progress"><i style="width:${pct}%"></i></div></div><div class="daily-ring" style="--pct:${pct}%"><strong>${pct}%</strong></div></div></section><div class="quick-grid"><div class="quick"><div class="qicon">✓</div><b>${done}/${tasks.length}</b><small>${t("tasks")}</small></div><div class="quick"><div class="qicon">📚</div><b>${att}/${lessons.length}</b><small>${lang==="ar"?"الحصص التي حضرتها":"Lessons attended"}</small></div><div class="quick"><div class="qicon">🕌</div><b>${pr}/5</b><small>${t("prayers")}</small></div><div class="quick"><div class="qicon">⏱️</div><b>${(mins/60).toFixed(1)}</b><small>${t("study")} ${t("hours")}</small></div></div><section class="section"><div class="sectionhead"><h3>🎯 ${t("tasks")}</h3><button class="link" onclick="go('tasks')">${t("addTask")} +</button></div><div class="day-card">${tasks.length?tasks.map(taskHTML).join(""):`<div class="empty">${t("noTasks")}</div>`}</div></section><section class="section"><div class="sectionhead"><h3>📚 ${t("lessons")}</h3><button class="link" onclick="go('lessons')">${t("lessons")} ›</button></div><div class="day-card">${lessons.length?lessons.map(l=>`<div class="lesson-check"><input type="checkbox" ${l.attended?"checked":""} onchange="toggleLesson('${l.id}',this.checked)"><div style="flex:1"><b>${esc(l.name)}</b><div class="subtitle">${l.time||t("optional")} • ${l.attended?(lang==="ar"?"حضرت ✓":"Attended ✓"):(lang==="ar"?"لم تحضر بعد":"Not attended yet")}</div></div></div>`).join(""):`<div class="empty">${t("noData")}</div>`}</div></section><section class="section"><div class="sectionhead"><h3>${t("prayers")}</h3></div><div class="day-card">${prayersHTML()}</div></section><section class="section"><div class="sleepbox"><b>🌙 ${t("sleep")}</b><div class="muted" style="color:#ddd;margin-top:5px">${sleepSummary()}</div><button onclick="sleepAction()">${state.sleep.start&&!state.sleep.wake?t("wakeNow"):t("sleepNow")}</button></div></section>`}
function taskHTML(x){return `<div class="task"><button class="check ${x.done?'done':''}" onclick="toggleTask('${x.id}')">${x.done?'✓':''}</button><div class="taskbody"><b>${esc(x.name)}</b><small>${x.date||today()} ${x.time?`• ${x.time}`:""} ${x.minutes?`• ${x.minutes} ${t("minutes")}`:""}</small></div><div class="actions"><button class="mini" onclick="openTask('${x.id}')">✎</button><button class="mini danger" onclick="delTask('${x.id}')">×</button></div></div>`}
function tasksPage(){return `<div class="sectionhead"><h3>${t("tasks")}</h3><button class="secondary" onclick="openTask()">＋ ${t("addTask")}</button></div><div class="card">${state.tasks.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(taskHTML).join("")||`<div class="empty">${t("noTasks")}</div>`}</div><section class="section"><div class="card"><b>🎯 ${t("target")}</b><div class="field"><label>${t("targetHours")}</label><input id="targetInp" type="number" min="0" step=".5" value="${state.target}"></div><button class="primary" onclick="setTarget()">${t("save")}</button></div></section>`}
function lessonsPage(){return `<div class="sectionhead"><h3>📚 ${t("lessons")}</h3><button class="secondary" onclick="openLesson()">＋ ${t("addLesson")}</button></div><div class="card">${state.lessons.map(l=>`<div class="task"><div class="taskbody"><b>${esc(l.name)}</b><small>${l.date} • ${l.time} ${l.reminder?`• 🔔 ${l.reminder}`:""}</small></div><div class="actions"><button class="mini" onclick="openLesson('${l.id}')">✎</button><button class="mini danger" onclick="delLesson('${l.id}')">×</button></div></div>`).join("")||`<div class="empty">${t("noData")}</div>`}</div><div class="card section"><b>💡 ${t("reminder")}</b><p class="muted">${lang==="ar"?"هذه الصفحة خاصة بمواعيد الدروس والتذكير بها. أما المهام التي يجب إنجازها فتضاف من قسم المهام.":"Use this page for lesson schedules and reminders. Tasks you need to complete belong in Tasks."}</p></div>`}
function prayersHTML(){let names=["fajr","dhuhr","asr","maghrib","isha"];return `<div class="prayers">${names.map(n=>`<label class="prayer"><input type="checkbox" ${state.prayers[today()+"_"+n]?'checked':''} onchange="pray('${n}',this.checked)"><div>${t(n)}</div></label>`).join("")}</div>`}
function statsPage(){const days=[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-i);return d.toISOString().slice(0,10)}).reverse();let rows=days.map(d=>{let a=state.tasks.filter(x=>x.date===d),done=a.filter(x=>x.done).length,mins=a.filter(x=>x.done).reduce((s,x)=>s+(+x.minutes||0),0);return {d,done,total:a.length,mins,p:a.length?Math.round(done/a.length*100):0}});let avg=Math.round(rows.reduce((s,x)=>s+x.p,0)/7);let examAvg=state.exams.length?Math.round(state.exams.reduce((s,e)=>s+e.p,0)/state.exams.length):0;return `<section class="hero"><h2>📈 ${t("analysis")}</h2><p>${t("last7")} • ${avg}%</p><div class="progress"><i style="width:${avg}%"></i></div></section><section class="section card"><b>📚 ${t("study")}</b>${rows.map(r=>`<div class="barrow"><span>${r.d.slice(5)}</span><div class="bar"><i style="width:${r.p}%"></i></div><small>${r.p}%</small></div>`).join("")}</section><section class="section grid"><div class="stat"><b>${examAvg||0}%</b><span>${t("exam")}</span></div><div class="stat"><b>${state.tasks.filter(x=>x.done).length}</b><span>${t("done")}</span></div></section><section class="section card"><b>📝 ${t("exam")}</b>${state.exams.map(e=>`<div class="task"><div class="taskbody"><b>${esc(e.subject)}</b><small>${e.score}/${e.outof} • ${e.p}%</small></div><button class="mini danger" onclick="delExam('${e.id}')">×</button></div>`).join("")||`<div class="empty">${t("noData")}</div>`}</section><button class="primary section" onclick="pdfReport()">${t("report")}</button>`}
function morePage(){return `<section class="section"><div class="sectionhead"><h3>☰ ${t("more")}</h3></div><div class="card"><button class="primary" onclick="openNote()">＋ ${t("addNote")}</button><div class="section">${state.notes.map(n=>`<div class="task"><div class="taskbody"><b>${esc(n.title)}</b><small>${esc(n.text)}</small></div><button class="mini danger" onclick="delNote('${n.id}')">×</button></div>`).join("")||`<div class="empty">${t("noData")}</div>`}</div></div><div class="card section"><b>📝 ${t("exam")}</b><button class="secondary" style="margin-top:10px" onclick="openExam()">＋ ${t("addExam")}</button></div><div class="card section"><b>🔒 ${t("private")}</b><p class="muted">${lang==="ar"?"مساحة خاصة محمية بكلمة مرور.":"A password-protected private space."}</p><button class="secondary" onclick="openPrivate()">${t("private")}</button></div><div class="card section"><b>⚙️ ${t("settings")}</b><button class="secondary" style="margin-top:10px" onclick="openSettings()">${t("settings")}</button></div></section>`}
window.openTask=(eid)=>{let x=state.tasks.find(z=>z.id===eid)||{id:"",name:"",date:today(),time:"",minutes:""};modal(`<h3>${eid?t("edit"):t("addTask")}</h3><div class="field"><label>${t("taskName")}</label><input id="f_name" placeholder="${lang==="ar"?"مثال: حل مسائل الرياضيات":"e.g. Solve math problems"}" value="${esc(x.name)}"></div><div class="row"><div class="field"><label>${t("date")}</label><input id="f_date" type="date" value="${x.date||today()}"></div><div class="field"><label>${t("time")} (${t("optional")})</label><input id="f_time" type="time" value="${x.time||""}"></div></div><div class="field"><label>${t("minutes")} (${t("optional")})</label><input id="f_min" type="number" min="0" placeholder="60" value="${x.minutes||""}"></div><button class="primary" onclick="saveTask('${x.id}')">${t("save")}</button><button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">${t("cancel")}</button>`)}
window.saveTask=eid=>{let n=document.getElementById("f_name").value.trim();if(!n)return toast(lang==="ar"?"اكتبي اسم المهمة أولًا":"Enter a task name first");let x={id:eid||id(),name:n,date:document.getElementById("f_date").value||today(),time:document.getElementById("f_time").value||"",minutes:+document.getElementById("f_min").value||0,done:eid?(state.tasks.find(z=>z.id===eid)?.done||false):false};if(eid)state.tasks=state.tasks.map(z=>z.id===eid?x:z);else state.tasks.push(x);sync();closeModal();render();toast(t("taskAdded"))}
window.toggleTask=i=>{let x=state.tasks.find(z=>z.id===i);if(x)x.done=!x.done;sync();render()}
window.delTask=i=>{state.tasks=state.tasks.filter(x=>x.id!==i);sync();render();toast(t("saved"))}
window.setTarget=()=>{state.target=+document.getElementById("targetInp").value||0;sync();toast(t("saved"))}
window.pray=(n,v)=>{state.prayers[today()+"_"+n]=v;sync()}
window.openLesson=eid=>{let x=state.lessons.find(z=>z.id===eid)||{id:"",name:"",date:today(),time:"",reminder:"",attended:false};modal(`<h3>${eid?t("edit"):t("addLesson")}</h3><div class="field"><label>${t("lessonName")}</label><input id="l_name" placeholder="${lang==="ar"?"مثال: درس الكيمياء":"e.g. Chemistry lesson"}" value="${esc(x.name)}"></div><div class="row"><div class="field"><label>${t("date")}</label><input id="l_date" type="date" value="${x.date}"></div><div class="field"><label>${t("time")}</label><input id="l_time" type="time" value="${x.time}"></div></div><div class="field"><label>${t("reminder")} (${t("optional")})</label><select id="l_rem"><option value="">${t("optional")}</option><option value="10">10 min</option><option value="30">30 min</option><option value="60">1 hour</option></select></div><button class="primary" onclick="saveLesson('${x.id}')">${t("save")}</button>`)}
window.saveLesson=eid=>{let oldLesson=state.lessons.find(z=>z.id===eid);let x={id:eid||id(),name:document.getElementById("l_name").value.trim(),date:document.getElementById("l_date").value,time:document.getElementById("l_time").value,reminder:document.getElementById("l_rem").value,attended:oldLesson?.attended||false};if(!x.name)return toast(t("lessonName"));if(eid)state.lessons=state.lessons.map(z=>z.id===eid?x:z);else state.lessons.push(x);sync();closeModal();render();toast(t("lessonAdded"))}
window.delLesson=i=>{state.lessons=state.lessons.filter(x=>x.id!==i);sync();render()}
window.toggleLesson=(i,v)=>{const x=state.lessons.find(z=>z.id===i);if(x){x.attended=v;sync();render();toast(t("saved"))}}
window.openNote=()=>modal(`<h3>${t("addNote")}</h3><div class="field"><label>${t("noteTitle")}</label><input id="n_title" placeholder="${lang==="ar"?"مثال: ملاحظات الكيمياء":"e.g. Chemistry notes"}"></div><div class="field"><label>${t("notes")}</label><textarea id="n_text" placeholder="${t("noteText")}"></textarea></div><button class="primary" onclick="saveNote()">${t("save")}</button>`)
window.saveNote=()=>{let title=document.getElementById("n_title").value.trim(),text=document.getElementById("n_text").value.trim();if(!text)return;state.notes.push({id:id(),title:title||t("notes"),text});sync();closeModal();render();toast(t("noteAdded"))}
window.delNote=i=>{state.notes=state.notes.filter(x=>x.id!==i);sync();render()}
window.openExam=()=>modal(`<h3>${t("addExam")}</h3><div class="field"><label>${t("subject")}</label><input id="e_sub" placeholder="${lang==="ar"?"مثال: الأحياء":"e.g. Biology"}"></div><div class="row"><div class="field"><label>${t("score")}</label><input id="e_score" type="number" min="0"></div><div class="field"><label>${t("outof")}</label><input id="e_out" type="number" min="1"></div></div><div class="card" id="eprev" style="margin:8px 0">${t("percent")}: —</div><button class="primary" onclick="saveExam()">${t("save")}</button>`)
window.saveExam=()=>{let s=+document.getElementById("e_score").value,o=+document.getElementById("e_out").value;if(!o||s<0||s>o)return toast(lang==="ar"?"راجعي الدرجة":"Check the score");let p=Math.round(s/o*1000)/10;state.exams.push({id:id(),subject:document.getElementById("e_sub").value.trim()||t("exam"),score:s,outof:o,p});sync();closeModal();render();toast(t("examAdded"))}
window.delExam=i=>{state.exams=state.exams.filter(x=>x.id!==i);sync();render()}
window.openSettings=()=>modal(`<h3>⚙️ ${t("settings")}</h3><div class="field"><label>${t("language")}</label><select id="langSel"><option value="ar" ${lang==="ar"?"selected":""}>${t("arabic")}</option><option value="en" ${lang==="en"?"selected":""}>${t("english")}</option></select></div><button class="primary" onclick="changeLang()">${t("save")}</button>`)
window.changeLang=()=>{lang=document.getElementById("langSel").value;state.settings.lang=lang;sync();closeModal();render()}
window.openPrivate=()=>modal(`<h3>🔒 ${t("private")}</h3><div class="field"><label>${t("password")}</label><input id="pw" type="password" inputmode="numeric" maxlength="4"></div><button class="primary" onclick="unlockPrivate()">${t("unlock")}</button>`)
window.unlockPrivate=()=>{if(document.getElementById("pw").value!=="2007")return toast(t("wrong"));closeModal();privatePage()}
function privatePage(){modal(`<h3>🔒 ${t("private")}</h3><div class="card"><b>🌷 ${t("period")}</b><div class="row"><div class="field"><label>${t("periodStart")}</label><input id="pstart" type="date" value="${state.private.periodStart||""}"></div><div class="field"><label>${t("cycle")}</label><input id="pcycle" type="number" min="15" max="60" value="${state.private.cycleLength||28}"></div></div><div class="field"><label>${t("periodDays")}</label><input id="pdays" type="number" min="1" max="14" value="${state.private.periodLength||5}"></div><button class="primary" onclick="savePrivate()">${t("save")}</button><div class="section"><b>📅 ${t("nextPeriod")}</b><p>${nextPeriod()}</p></div></div><div class="card section"><b>📊 ${t("analysis")}</b><p>${privateStats()}</p></div><div class="card section"><b>💜 ${t("tip")}</b><p>${T[lang].motivation[Math.floor(Math.random()*T[lang].motivation.length)]}</p><button class="secondary" onclick="privatePage()">↻</button></div><div class="card section"><b>📝 ${t("notes")}</b><textarea id="pnotes" placeholder="${t("noteText")}">${esc(state.private.notes||"")}</textarea><button class="primary" onclick="savePrivateNotes()">${t("save")}</button></div>`)}
function savePrivate(){state.private.periodStart=document.getElementById("pstart").value;state.private.cycleLength=+document.getElementById("pcycle").value||28;state.private.periodLength=+document.getElementById("pdays").value||5;sync();privatePage();toast(t("saved"))}
function savePrivateNotes(){state.private.notes=document.getElementById("pnotes").value;sync();toast(t("saved"))}
function nextPeriod(){if(!state.private.periodStart)return t("noData");let d=new Date(state.private.periodStart+"T00:00:00");d.setDate(d.getDate()+(+state.private.cycleLength||28));return new Intl.DateTimeFormat(lang==="ar"?"ar-EG":"en-US",{dateStyle:"long"}).format(d)}
function privateStats(){if(!state.private.periodStart)return t("noData");let s=new Date(state.private.periodStart+"T00:00:00"),now=new Date();let days=Math.max(1,Math.floor((now-s)/86400000)+1),cycle=+state.private.cycleLength||28;let inPeriod=((days-1)%cycle)<(+state.private.periodLength||5);return `${lang==="ar"?"بدأت في":"Started"} ${new Intl.DateTimeFormat(lang==="ar"?"ar-EG":"en-US",{dateStyle:"medium"}).format(s)} • ${days} ${lang==="ar"?"يومًا منذ البداية":"days since start"} • ${inPeriod?(lang==="ar"?"أيام مسجلة داخل المدة الحالية":"currently within the recorded period"): (lang==="ar"?"خارج المدة الحالية":"outside the recorded period")}.`}
function sleepSummary(){if(!state.sleep.start)return t("noData");if(!state.sleep.wake)return `${t("sleepStart")}: ${new Date(state.sleep.start).toLocaleTimeString(lang==="ar"?"ar-EG":"en-US",{hour:"2-digit",minute:"2-digit"})}`;let h=(new Date(state.sleep.wake)-new Date(state.sleep.start))/36e5;let status=h<7?t("sleepLow"):h<=9?t("sleepGood"):t("sleepHigh");return `${h.toFixed(1)} ${t("hours")} • ${status}`}
window.sleepAction=()=>{if(state.sleep.start&&!state.sleep.wake){state.sleep.wake=new Date().toISOString()}else{state.sleep={start:new Date().toISOString(),wake:""}};sync();render()}
window.pdfReport=()=>{let rows=state.tasks.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${x.done?t("done"):t("remaining")}</td><td>${x.minutes||0}</td></tr>`).join("");let exams=state.exams.map(e=>`<tr><td>${esc(e.subject)}</td><td>${e.score}/${e.outof}</td><td>${e.p}%</td></tr>`).join("");let w=open("","_blank");w.document.write(`<html dir="${lang==="ar"?"rtl":"ltr"}"><meta charset="utf-8"><title>Doctor Zeinab</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse;margin:15px 0}td,th{border:1px solid #ccc;padding:8px}h1{color:#704aa7}</style><h1>Doctor Zeinab</h1><p>${new Date().toLocaleString()}</p><h2>${t("tasks")}</h2><table><tr><th>${t("date")}</th><th>${t("taskName")}</th><th>${t("done")}</th><th>${t("minutes")}</th></tr>${rows}</table><h2>${t("exam")}</h2><table><tr><th>${t("subject")}</th><th>${t("score")}</th><th>${t("percent")}</th></tr>${exams}</table><script>window.print()<\/script></html>`);w.document.close()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body></html>
